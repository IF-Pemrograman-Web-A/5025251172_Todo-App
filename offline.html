<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#b72334">
    <meta name="description" content="Todo App offline page">

    <title>You're Offline | Todo App</title>

    <style>
        :root {
            color-scheme: light;
            --text: #fff;
            --muted: rgba(255, 255, 255, .86);
            --panel: rgba(255, 255, 255, .23);
            --border: rgba(255, 255, 255, .50);
            --accent: rgba(183, 35, 52, .58);
            --accent-border: rgba(255, 190, 197, .55);
            --shadow: rgba(20, 5, 8, .18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            background:
                linear-gradient(rgba(15, 5, 8, .22), rgba(15, 5, 8, .30)),
                url("img/bg.jpg") center / cover fixed no-repeat;
            background-color: #3a0f16;
        }

        body.dark-mode {
            color-scheme: dark;
            --panel: rgba(18, 18, 20, .68);
            --border: rgba(255, 255, 255, .24);
            --shadow: rgba(0, 0, 0, .35);
            background:
                linear-gradient(rgba(0, 0, 0, .40), rgba(0, 0, 0, .48)),
                url("img/bg.jpg") center / cover fixed no-repeat;
            background-color: #1a0a0d;
        }

        .offline-container {
            width: 100%;
            max-width: 420px;
            padding: 40px 28px;
            border: 1px solid var(--border);
            border-radius: 24px;
            background: var(--panel);
            box-shadow:
                0 8px 22px var(--shadow),
                inset 0 1px rgba(255, 255, 255, .16);
            backdrop-filter: blur(20px) saturate(145%);
            -webkit-backdrop-filter: blur(20px) saturate(145%);
        }

        .offline-icon {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 1.7;
            stroke-linecap: round;
            stroke-linejoin: round;
            opacity: .92;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 28px;
            text-shadow: 0 2px 8px #0007;
        }

        p {
            margin-bottom: 24px;
            color: var(--muted);
            line-height: 1.6;
        }

        button {
            min-height: 40px;
            padding: 10px 24px;
            border: 1px solid var(--accent-border);
            border-radius: 10px;
            color: #fff;
            background: var(--accent);
            box-shadow: inset 0 1px rgba(255, 255, 255, .2);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background .18s ease;
        }

        button:hover {
            background: rgba(218, 47, 65, .74);
        }
    </style>
</head>

<body>
    <main class="offline-container">
        <svg class="offline-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 20h.01" />
            <path d="M8.5 16.429a5 5 0 0 1 7 0" />
            <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
            <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
            <path d="m2 2 20 20" />
        </svg>

        <h1>You're Offline</h1>

        <p>
            Please check your connection and try again.
        </p>

        <button type="button" onclick="window.location.reload()">
            Try Again
        </button>
    </main>

    <script>
        // Follow the theme chosen in the main app.
        try {
            if (localStorage.getItem("todo-e04-theme-v1") === "dark") {
                document.body.classList.add("dark-mode");
            }
        } catch (error) {
            // Ignore storage errors.
        }
    </script>
</body>
</html>
