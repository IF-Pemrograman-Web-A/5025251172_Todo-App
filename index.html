<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="Todo List application">
        <title>Todo List</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="app-shell">
            <header class="topbar">
                <h1>Todo List</h1>
                <button id="themeButton" class="icon-button" type="button" aria-label="Change Theme">☼</button>
            </header>

            <main class="main-grid">
                <section class="panel tasks-panel">
                    <div class="panel-heading">
                        <h2 id="listHeading">Tasks</h2>
                        <span id="taskCount">0 tasks</span>
                    </div>

                    <div id="todoContainer" class="todo-list" aria-live="polite"></div>
                    <p id="emptyMessage" class="empty-message">No Tasks yet. Add a task below.</p>
                </section>

                <section class="panel detail-panel">
                    <h2>Task Detail</h2>
                    <div id="emptyDetail" class="empty-detail">
                        <svg class="document-icon" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M12 5h17l9 9v28H12z" />
                            <path d="M29 5v10h9M18 23h14M18 29h14M18 35h9" />
                        </svg>

                        <p>Select a task to see details</p>
                    </div>

                    <form id="editForm" class="detail-form hidden">
                        <label for="editTitle">Title</label>
                        <input id="editTitle" required maxlength="100">

                        <label for="editDescription">Description</label>
                        <textarea id="editDescription" rows="3"></textarea>

                        <label for="editDueDate">Due Date</label>
                        <input id="editDueDate" type="datetime-local">

                        <details class="extra-options">
                            <summary>Reminder and task options</summary>
                            <label for="editNotificationTime">Notification Time</label>
                            <input id="editNotificationTime" type="datetime-local">
                        </details>

                        <button class="primary-button" type="submit">Save Changes</button>
                    </form>
                </section>

                <section class="panel create-panel">
                    <h2>Create New Task</h2>
                    <form id="todoForm" class="create-form">
                        <label class="sr-only" for="newTitle">Title</label>
                        <input id="newTitle" required maxlength="100" placeholder="Title">

                        <label class="sr-only" for="newDescription">Description</label>
                        <input id="newDescription" placeholder="Description">

                        <label class="sr-only" for="newDueDate">Due Date</label>
                        <input id="newDueDate" type="datetime-local">

                        <button class="primary-button add-button" type="submit">Add Task</button>

                        <details class="extra-options create-extra">
                            <summary>Reminder and image options</summary>
                            <label for="newNotificationTime">Notification Time</label>
                            <input id="newNotificationTime" type="datetime-local">

                            <div class="image-tools">
                                <label class="file-button">Add Image
                                    <input id="imageInput" type="file" accept="image/*" hidden>
                                </label>

                                <button id="startCameraButton" type="button" class="secondary-button">Open Camera</button>
                                <button id="captureButton" type="button" class="secondary-button" disabled>Capture Image</button>
                            </div>
                        </details>

                        <video id="cameraPreview" class="camera-preview hidden" autoplay playsinline></video>
                        <img id="imagePreview" class="image-preview hidden" alt="Preview of task image">
                    </form>
                </section>
            </main>

            <footer>[E04] The Iron Citadel</footer>
        </div>

        <script src="script.js"></script>
    </body>
</html>
