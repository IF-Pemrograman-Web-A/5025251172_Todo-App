<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Todo List application for managing tasks">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HEADER -->
        <header>

            <h1>Todo List</h1>

            <button
                id="themeButton"
                class="theme-button"
                type="button"
                aria-label="Toggle dark mode"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                >

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                    ></circle>

                    <line
                        x1="12"
                        y1="2"
                        x2="12"
                        y2="5"
                    ></line>

                    <line
                        x1="12"
                        y1="19"
                        x2="12"
                        y2="22"
                    ></line>

                    <line
                        x1="2"
                        y1="12"
                        x2="5"
                        y2="12"
                    ></line>

                    <line
                        x1="19"
                        y1="12"
                        x2="22"
                        y2="12"
                    ></line>

                    <line
                        x1="4.9"
                        y1="4.9"
                        x2="7"
                        y2="7"
                    ></line>

                    <line
                        x1="17"
                        y1="7"
                        x2="19.1"
                        y2="4.9"
                    ></line>

                    <line
                        x1="17"
                        y1="17"
                        x2="19.1"
                        y2="19.1"
                    ></line>

                    <line
                        x1="4.9"
                        y1="19.1"
                        x2="7"
                        y2="17"
                    ></line>

                </svg>

            </button>

        </header>


        <main>

            <!-- TASKS -->
            <section class="tasks-section" aria-labelledby="tasks-heading">

                <h2 id="tasks-heading">Tasks</h2>

                <div
                    id="todoContainer"
                    class="todo-container"
                    aria-live="polite"
                    aria-label="Todo list"
                ></div>

            </section>

            <!-- TASK DETAIL -->
            <section class="task-detail" aria-labelledby="detail-heading">

                <h2 id="detail-heading">Task Detail</h2>

                <div
                    id="emptyDetail"
                    class="empty-detail"
                >

                    <div class="detail-icon">

                        <svg viewBox="0 0 24 24">

                            <path d="M6 2h9l4 4v16H6z"></path>

                            <polyline
                                points="15,2 15,6 19,6"
                            ></polyline>

                            <line
                                x1="9"
                                y1="11"
                                x2="16"
                                y2="11"
                            ></line>

                            <line
                                x1="9"
                                y1="14"
                                x2="16"
                                y2="14"
                            ></line>

                            <line
                                x1="9"
                                y1="17"
                                x2="14"
                                y2="17"
                            ></line>

                        </svg>

                    </div>

                    <p>Select a task to see details</p>

                </div>

                <!-- EDIT TASK FORM -->
                <div
                    id="detailForm"
                    class="detail-form hidden"
                >

                    <label for="editTitle">Title</label>

                    <input
                        type="text"
                        id="editTitle"
                        required
                    >

                    <label for="editDescription">Description</label>

                    <textarea
                        id="editDescription"
                        required
                    ></textarea>

                    <label for="editDueDate">Due Date & Time</label>

                    <input
                        type="datetime-local"
                        id="editDueDate"
                        required
                    >

                    <label for="editNotificationTime">Notification Time</label>

                    <input
                        type="datetime-local"
                        id="editNotificationTime"
                    >

                    <button
                        type="button"
                        id="saveButton"
                    >
                        Save Changes
                    </button>

                </div>

            </section>

        </main>

        <!-- CREATE NEW TASK -->
        <section class="create-task" aria-labelledby="create-heading">

            <h2 id="create-heading">Create New Task</h2>

            <form id="todoForm">

                <!-- TITLE -->
                <label for="newTitle">Title</label>

                <input
                    type="text"
                    id="newTitle"
                    placeholder="Title"
                    required
                >

                <!-- DESCRIPTION -->
                <label for="newDescription">Description</label>

                <textarea
                    id="newDescription"
                    placeholder="Description"
                    required
                ></textarea>

                <!-- DUE DATE -->
                <label for="newDueDate">Due Date & Time</label>

                <input
                    type="datetime-local"
                    id="newDueDate"
                    required
                >

                <!-- NOTIFICATION TIME -->
                <label for="newNotificationTime">Notification Time</label>

                <input
                    type="datetime-local"
                    id="newNotificationTime"
                >

                <!-- TASK IMAGE -->
                <div class="image-field">

                    <span class="field-label">Task Image</span>

                    <div class="image-buttons">

                        <!-- OPEN / STOP CAMERA -->
                        <button
                            type="button"
                            id="startCameraButton"
                        >
                            Open Camera
                        </button>

                        <!-- CAPTURE IMAGE -->
                        <button
                            type="button"
                            id="captureButton"
                            disabled
                        >
                            Capture Image
                        </button>


                        <!-- ADD IMAGE FROM FILE -->
                        <button
                            type="button"
                            id="addImageButton"
                        >
                            Add Image
                        </button>


                        <!-- HIDDEN FILE INPUT -->
                        <input
                            type="file"
                            id="imageInput"
                            accept="image/*"
                            class="hidden"
                        >

                    </div>

                    <!-- CAMERA PREVIEW -->
                    <video
                        id="cameraPreview"
                        class="camera-preview hidden"
                        autoplay
                        playsinline
                        aria-label="Camera preview"
                    ></video>

                    <!-- CANVAS -->
                    <canvas
                        id="cameraCanvas"
                        class="hidden"
                    ></canvas>

                    <!-- IMAGE PREVIEW -->
                    <img
                        id="imagePreview"
                        class="image-preview hidden"
                        alt="Preview of selected task image"
                    >

                </div>


                <!-- ADD TASK -->
                <button type="submit">Add Task</button>

            </form>

        </section>


        <!-- FOOTER -->
        <footer>[E03] The Lost Cavern</footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
